<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<style>
  /* The link-preview image (og:image), 1200 x 630. Same type and colours as the site and the
     LinkedIn banner A. Rendered to public/og.png by render.mjs. */
  @font-face {
    font-family: 'Schibsted Grotesk';
    src: url('../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 400 900;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
  }
  :root {
    --ink: #151513;
    --term-text: #e9e8e1;
    --term-dim: #9b998e;
    --term-pass: #5fd09a;
    --sans: 'Schibsted Grotesk', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; font-family: var(--sans); }

  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: var(--ink); color: var(--term-text);
  }
  .og::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgb(255 255 255 / 0.07) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    mask-image: linear-gradient(90deg, transparent 10%, #000 75%);
  }
  .copy { position: absolute; left: 72px; top: 70px; width: 1056px; }
  .name { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .label {
    margin-top: 10px; font-family: var(--mono); font-size: 18px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--term-dim);
  }
  h1 { margin-top: 34px; font-size: 76px; font-weight: 750; line-height: 1.02; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--term-pass); }

  .term {
    position: absolute; left: 72px; right: 72px; bottom: 64px;
    display: flex; align-items: center; gap: 28px;
    padding: 18px 24px;
    background: #0b0b0a; border: 1px solid rgb(255 255 255 / 0.1); border-radius: 14px;
    font-family: var(--mono); font-size: 17px; line-height: 1.6;
    box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.6);
  }
  .checks { flex: 1; display: grid; grid-template-columns: auto auto; justify-content: start; column-gap: 26px; }
  .checks p { white-space: nowrap; }
  .ok { color: var(--term-pass); margin-right: 10px; }
  .dim { color: var(--term-dim); }
  .url { flex: none; margin-left: auto; font-size: 20px; font-weight: 500; color: var(--term-pass); white-space: nowrap; }
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="copy">
      <p class="name">Daniel Iyoha</p>
      <p class="label">QA &amp; Web Development · Lagos</p>
      <h1>I build websites,<br />then I try to <em>break</em> them.</h1>
    </div>
    <div class="term">
      <div class="checks">
        <p><span class="ok">✓</span>wimika.ng <span class="dim">› contrast checks</span></p>
        <p><span class="ok">✓</span>moneyguard <span class="dim">› launch flows</span></p>
        <p><span class="ok">✓</span>ellanielos.com.ng <span class="dim">› accessibility 100</span></p>
        <p><span class="ok">✓</span>linkhut <span class="dim">› bugs logged</span></p>
      </div>
      <p class="url">daniel-iyoha.web.app</p>
    </div>
  </div>
</body>
</html>
